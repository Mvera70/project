name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Los tres trabajos tenían un tope de 10 minutos y la suite rápida sola tarda
  # más: desde el 28 sep 2026 la CI se cortaba («cancelled») antes de decir
  # nada. Topes con margen, y las jornadas en su propio trabajo para que su
  # resultado no tape el de la compilación y el lint. En el servidor todo va
  # unas cinco veces más lento que en local: las jornadas (284 s en local) no
  # cabían en 30 minutos y se cortaban igual (29 sep 2026).
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint

  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # El tercer nivel de §14: jornadas y siglos en varias semillas. Fuera del
      # bucle de trabajo por lo que cuesta, dentro de la puerta porque es lo que
      # prueba la capa que hoy mueve la aldea.
      - run: npm run test:journeys

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:shots
      # §13.4: the offline promise is checked against the real build, so a
      # regression in the worker cannot reach a device that trusts it.
      - run: npm run test:pwa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
