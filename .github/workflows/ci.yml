name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Los tres trabajos tenían un tope de 10 minutos y la suite rápida sola tarda
  # más: desde el 28 sep 2026 la CI se cortaba («cancelled») antes de decir
  # nada. Topes con margen, y las jornadas en su propio trabajo para que su
  # resultado no tape el de la compilación y el lint. En el servidor todo va
  # unas cinco veces más lento que en local: las jornadas (284 s en local) no
  # cabían en 30 minutos y se cortaban igual (29 sep 2026).
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # El servidor mide los cronómetros del aparato del jugador unas tres veces
      # más lentos que el portátil donde se fijaron (`tests/helpers/timing.ts`):
      # `catchUp` 3,0–3,6 s contra 2 s el 30 sep 2026.
      - run: npm test
        env:
          VALLEY_TIMING_SCALE: 3
      - run: npm run build
      - run: npm run lint

  # Enteras en un solo servidor tardaban 48 minutos (#280) y, con la jornada
  # larga del sonido, pasaron del tope de 60 y se cortaban sin decir nada
  # (30 sep 2026). En tres trozos que corren a la vez, cada uno cabe holgado.
  # Desde v5.56 (1 oct 2026) reciben también lo que pasaba de diez segundos en
  # `fast` —que tardaba 36 minutos— y van en seis trozos repartidos por peso
  # (`tests/journeys/shard-weights.ts`): con el reparto por hash de vitest, los
  # tres de antes tardaban 11, 33 y 30 minutos.
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # El tercer nivel de §14: jornadas y siglos en varias semillas. Fuera del
      # bucle de trabajo por lo que cuesta, dentro de la puerta porque es lo que
      # prueba la capa que hoy mueve la aldea.
      - run: npm run test:journeys -- --shard=${{ matrix.shard }}/6
        env:
          VALLEY_TIMING_SCALE: 3

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:shots
      # §13.4: the offline promise is checked against the real build, so a
      # regression in the worker cannot reach a device that trusts it.
      - run: npm run test:pwa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
