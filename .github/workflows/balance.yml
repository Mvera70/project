name: Nightly balance

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:balance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-${{ github.run_number }}
          path: |
            artifacts/balance.csv
            artifacts/balance-summary.json
          if-no-files-found: warn
          retention-days: 14
