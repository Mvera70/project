<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8fae5b" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <!-- iOS reads neither the manifest's icons nor its display mode. -->
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="The Valley" />
    <title>The Valley</title>
    <style>
      html, body { margin: 0; height: 100%; background: #20201d; overscroll-behavior: none; }
      body { display: grid; place-items: center; font: 14px/1.4 system-ui, sans-serif; color: #3c3a34; }
      .valley-app { --valley-void: #b9c9cf; position: relative; display: grid; place-items: start center; width: min(100vw, 390px); height: min(100dvh, 844px); overflow: hidden; background: var(--valley-void); }
      #valley { display: block; margin-top: max(22px, env(safe-area-inset-top)); border: 2px solid transparent; touch-action: none; }
      .valley-year { position: absolute; top: max(7px, env(safe-area-inset-top)); left: 15px; color: #303029; font: 600 11px/1.2 Georgia, serif; letter-spacing: .12em; }
      .valley-speeds { position: absolute; right: max(10px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); display: flex; gap: 6px; }
      .valley-speeds button { min-width: 44px; min-height: 44px; padding: 0 8px; border: 1px solid rgba(48,48,41,.35); border-radius: 50%; background: rgba(242,244,246,.76); color: #303029; font: 600 12px/1 system-ui,sans-serif; }
      .valley-speeds button[aria-pressed="true"] { background: #303029; color: #f2f4f6; }
      .valley-panel { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; box-sizing: border-box; max-height: 48%; overflow: auto; padding: 18px 20px max(20px, env(safe-area-inset-bottom)); background: rgba(242,244,246,.96); border-top: 2px solid #3c3a34; }
      .valley-panel[hidden] { display: none; }
      .valley-panel h2 { margin: 0 0 8px; text-transform: capitalize; font: 600 20px/1.2 Georgia,serif; }
      .valley-panel p { margin: 4px 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
