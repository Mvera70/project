<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- UI-V7 · `user-scalable=no`: el juego tiene su propio zoom (pellizco sobre
         el valle) y sin esto el navegador se quedaba el gesto y ampliaba la
         página entera, cifras y bandeja incluidas. Lo encontró el dueño del
         diseño probando en la tablet: «no se puede hacer zoom del juego, sino
         hacer zoom a todo». -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8fae5b" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <!-- iOS reads neither the manifest's icons nor its display mode. -->
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="The Valley" />
    <title>The Valley</title>
    <style>
      /* U-01 · La piel. design.md §11.1, §11.1.1, §11.2.
         El valle sigue siendo el HUD: esto no añade ni un elemento, viste los
         que §11.1.1 ya autorizó. Pergamino y tinta, que es de lo que está hecha
         la crónica, en vez de las pastillas blancas de sistema que tenía.
         Ni una fuente de red: la demo se abre sin servidor detrás, así que todo
         son pilas del sistema y no `system-ui` a secas, que no es una elección.
         Y ni una animación sobre el reloj de pared (§11.4): lo único que se
         mueve aquí responde al dedo. */
      :root {
        --ink: #221d18;          /* tinta, no negro: el valle es cálido */
        --ink-soft: #57493c;
        --parchment: #f2e9d8;
        --plate: rgba(242,233,216,.90);
        --edge: rgba(34,29,24,.16);
        --gild: #7d5c2e;         /* latón viejo, para el año */
        --alarm: #9e4a34;        /* el hambre de §5.3 */
        --void: #b9c9cf;         /* el cielo tras el valle */
        /* Y las mismas cosas sobre fondo oscuro, que es donde viven las tres
           pantallas de §11.2: la encrucijada, la crónica y el epitafio. */
        --night: #1a1511;
        --night-soft: #262019;
        --gild-lit: #c9ab6b;     /* el latón, encendido, para leerse en lo oscuro */
        --paper-dim: #d9cfbc;
        --voice: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
        --plain: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      html, body { margin: 0; height: 100%; background: var(--ink); overscroll-behavior: none; }
      body { display: grid; place-items: center; font: 14px/1.45 var(--plain); color: var(--ink); }
      /* UI-V7 · **La aplicación ocupa la pantalla entera, sin tope.**

         Aquí había `width: min(100vw, 390px); height: min(100dvh, 844px)`, y en
         un móvil eso es la pantalla y no se nota. En una tablet no: medido a
         1240 x 1900, el juego se pintaba en una columna de 390 px centrada en
         x 425, con el fondo de la página alrededor, y de ese tope salían los
         tres defectos que el dueño del diseño encontró probándolo:

           1. «La pantalla se mueve y no se queda fija»: el documento era más
              grande que el juego, así que se podía arrastrar entero.
           2. «No se puede hacer zoom del juego, sino zoom a todo»: el pellizco
              caía en el documento y no en el valle.
           3. «Tampoco se puede girar el ángulo de visión»: lo mismo, el gesto
              no llegaba nunca al lienzo.

         Y además la carcasa iba por su cuenta: la bandeja, la navegación y la
         crónica se posicionan con `fixed`, que se mide contra la **pantalla** y
         no contra esta caja, así que ocupaban los 1240 px mientras el valle
         ocupaba 390. Con la caja a pantalla completa las dos cosas vuelven a
         coincidir, y el renderer se adapta solo: se mide contra este elemento
         (`backend.ts`, `size()`) y `view.resize` reencuadra, así que una
         pantalla más ancha **enseña más valle**, que es lo que se pidió. */
      .valley-app { --valley-void: var(--void); position: relative; display: grid; place-items: start center;
        width: 100vw; height: 100dvh; overflow: hidden; background: var(--valley-void); }
      #valley { display: block; margin-top: max(22px, env(safe-area-inset-top)); border: 2px solid transparent; touch-action: none; }
      /* **Y el lienzo 3D también, que es el que se toca de verdad.** `#valley`
         —el 2D— lo tenía desde U-01 y el 3D nació sin él: el navegador se
         quedaba el pellizco y el arrastre antes de que los llevara a
         `backend.live.zoom`/`orbit`, que están cableados y funcionando desde
         siempre en `app.ts`. Va en el lienzo y no en `.valley-app` a propósito:
         así el gesto que empieza sobre el valle es del juego, y el que empieza
         sobre la crónica o la bandeja sigue desplazando el papel. */
      #valley3d { touch-action: none; }

      /* U-12 · la hora, donde estaba el año. Es la identidad del juego y el
         instrumento que dice a qué hora vive la aldea, así que va en la voz del
         juego y con cifras de ancho fijo: un reloj que baila al pasar de las
         09:00 a las 10:00 se lee como un error. */
      .valley-time { position: absolute; z-index: 2; top: max(7px, env(safe-area-inset-top)); left: 15px;
        color: var(--gild); font: 600 17px/1.1 var(--voice); letter-spacing: .08em;
        font-variant-numeric: tabular-nums; text-shadow: 0 1px 0 rgba(242,233,216,.55); }

      /* U-12 · la fecha, bajo la hora: año, estación y día. Versalitas de
         verdad (`font-variant-caps`), no mayúsculas forzadas: el texto del
         banco va en mayúscula-minúscula normal y es esta regla la que lo dibuja
         pequeño. Ocupaba esta línea la estación sola hasta v3.72. */
      .valley-date { position: absolute; z-index: 2; top: calc(max(7px, env(safe-area-inset-top)) + 19px); left: 15px;
        color: var(--ink-soft); font: 600 10px/1.1 var(--plain); letter-spacing: .1em;
        font-variant-caps: all-small-caps; font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 0 rgba(242,233,216,.4); }

      /* §11.1.1 · la tira de la aldea. **Una placa, no cuatro insignias**: son
         cuatro lecturas del mismo instrumento, y separadas se leían como cuatro
         cosas sin relación. Filetes en medio, y la gente primero porque es el
         juego. Baja un poco desde U-06 para dejar sitio a la línea de estación. */
      .valley-vitals { position: absolute; z-index: 2; top: calc(max(7px, env(safe-area-inset-top)) + 32px); left: 13px;
        display: flex; align-items: stretch; padding: 1px; border: 1px solid var(--edge); border-radius: 7px;
        background: var(--plate); box-shadow: 0 1px 3px rgba(34,29,24,.18); backdrop-filter: blur(2px); }
      .valley-vital { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; color: var(--ink);
        font: 600 11px/1 var(--plain); font-variant-numeric: tabular-nums; }
      .valley-vital + .valley-vital { border-left: 1px solid var(--edge); }
      .valley-vital b { font-weight: 700; letter-spacing: .01em; }
      .valley-vital.thin { color: var(--alarm); }
      .valley-vital.thin b { font-weight: 800; }
      /* La comida en aviso lo dice también el trazo del icono, no sólo el
         color (§11.1.1, U-06): quien no distingue el color ve el dibujo más
         grueso igual. */
      .valley-vital.thin svg { stroke-width: 2.4; }
      /* E4 · La dirección de una cifra. Siete píxeles y sin color propio: hereda
         la tinta de la celda, así que la comida en aviso la tiene roja como su
         número y el resto en tinta. Subir y bajar **no son bueno y malo** —más
         gente es mejor, más semanas de comida es mejor, pero eso lo sabe el
         jugador— así que la flecha informa y no juzga, que es la regla de §9.3
         llevada a un dibujo de siete píxeles. */
      .valley-trend { display: inline-flex; align-items: center; margin-left: 1px;
        opacity: .72; }
      .valley-trend:empty { display: none; }

      /* **La línea de estado de la aldea** (`ui/doing.ts`): qué está haciendo,
         bajo la tira. Sin placa y sin filete a propósito: no es un instrumento
         que se toque, es una frase, así que va como va la línea de la estación
         —tinta sobre el valle, con el relieve de pergamino detrás para que se
         lea sobre el prado—. La serif de la crónica, porque es la voz de la
         aldea y no una etiqueta de interfaz. */
      .valley-doing { position: absolute; z-index: 2; left: 14px; margin: 0;
        top: calc(max(7px, env(safe-area-inset-top)) + 62px);
        max-width: min(72vw, 300px); color: var(--ink); text-wrap: pretty;
        font: 13px/1.25 var(--voice); letter-spacing: .005em;
        text-shadow: 0 1px 0 rgba(242,233,216,.65), 0 0 3px rgba(242,233,216,.5); }
      .valley-doing:empty, .valley-doing[hidden] { display: none; }

      /* E1 · **El mando**, y desde el 15 sep 2026 una hoja y no tres filas a la
         vista. Las tres filas de doce botones se comían el tercio de arriba de
         la pantalla siempre abiertas: «comiéndose media pantalla», dijo el dueño
         del diseño. Ahora: **una línea** bajo la frase de estado dice cómo están
         las órdenes, y tocarla abre la hoja desde abajo con la piel de la ficha
         (`.valley-panel`). Cerrada no ocupa nada; el valle es la pantalla. */
      .valley-orders-now { position: absolute; z-index: 2; left: 14px; margin: 0; padding: 2px 0;
        top: calc(max(7px, env(safe-area-inset-top)) + 80px);
        max-width: min(78vw, 320px); border: 0; background: transparent; text-align: left;
        color: var(--ink-soft); cursor: pointer; text-wrap: pretty;
        font: italic 12.5px/1.25 var(--voice); letter-spacing: .005em;
        text-shadow: 0 1px 0 rgba(242,233,216,.65), 0 0 3px rgba(242,233,216,.5);
        -webkit-tap-highlight-color: transparent; }
      .valley-orders-now::before { content: '› '; font-style: normal; color: var(--gild); }
      .valley-orders-now:focus-visible { outline: 2px solid var(--gild); outline-offset: 2px; }
      /* La hoja: las tres palancas, una debajo de otra, cada una con su nombre
         encima y sus posiciones debajo. Botones de 44 px de alto (§11.3): aquí
         hay sitio, que es justo lo que arriba no había. */
      .valley-orders .valley-order { display: flex; flex-direction: column; align-items: flex-start;
        gap: 6px; margin: 12px 0 2px; }
      .valley-order-name { color: var(--ink-soft); font: 600 11px/1.1 var(--plain);
        letter-spacing: .1em; font-variant-caps: all-small-caps; }
      .valley-order-bar { display: flex; flex-wrap: wrap; padding: 2px; gap: 2px;
        border: 1px solid var(--edge); border-radius: 8px; background: rgba(34,29,24,.04); }
      .valley-order-bar button { min-width: 44px; min-height: 40px; padding: 0 12px;
        border: 0; border-radius: 6px; background: transparent; color: var(--ink-soft);
        font: 600 13px/1 var(--plain); letter-spacing: .02em; cursor: pointer;
        -webkit-tap-highlight-color: transparent; }
      .valley-order-bar button:active { background: rgba(34,29,24,.10); }
      .valley-order-bar button[aria-pressed="true"] { background: var(--ink); color: var(--parchment); }
      .valley-order-bar button:focus-visible { outline: 2px solid var(--gild); outline-offset: 2px; }
      /* **El tiempo, un control pequeño.** Un botón con la velocidad de ahora;
         tocarlo despliega la regleta a su lado y elegir la recoge. Misma piel
         que el botón de sonido, porque son la misma clase de cosa. */
      .valley-speed-badge { min-width: 44px; height: 44px; padding: 0 12px; border: 1px solid var(--edge);
        border-radius: 22px; background: var(--plate); color: var(--ink);
        font: 700 14px/1 var(--plain); font-variant-numeric: tabular-nums; cursor: pointer;
        box-shadow: 0 2px 6px rgba(34,29,24,.20); backdrop-filter: blur(2px);
        -webkit-tap-highlight-color: transparent; }
      .valley-speed-badge:active { background: rgba(34,29,24,.10); }
      .valley-speed-badge:focus-visible { outline: 2px solid var(--gild); outline-offset: 2px; }
      .valley-speeds[hidden] { display: none; }

      /* U-06 · el bump de una cifra que acaba de cambiar. La duración la
         manda `TIME.VITAL_BUMP_MS` desde `app.ts` (`animationDuration` en
         línea, nada de un número aquí) y `animationend` retira la clase sola:
         nunca una transición colgada del reloj del juego (§11.4). */
      @keyframes valley-vital-bump { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
      .valley-vital.bump { animation-name: valley-vital-bump; animation-timing-function: ease-out; }
      @media (prefers-reduced-motion: reduce) {
        .valley-vital.bump { animation: none; }
      }

      /* La velocidad, en una sola regleta: son tres posiciones de un mando, no
         tres botones distintos. Sigue cumpliendo los 44 px de §11.3.
         U-05 · sube y se queda a la derecha, encima de la barra de abajo, sin
         taparla: el hueco es la altura de esa barra más un respiro.
         U-09 · la regleta ya no se posiciona sola: comparte fila con el botón
         de sonido dentro de `.valley-hud-right`, que es quien ahora ancla el
         rincón. */
      .valley-hud-right { position: absolute; z-index: 2; right: max(10px, env(safe-area-inset-right));
        bottom: calc(60px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px; }
      .valley-speeds { display: flex; padding: 2px; gap: 2px;
        border: 1px solid var(--edge); border-radius: 24px; background: var(--plate);
        box-shadow: 0 2px 6px rgba(34,29,24,.20); backdrop-filter: blur(2px); }
      .valley-speeds button { min-width: 44px; min-height: 44px; padding: 0 6px; border: 0; border-radius: 21px;
        background: transparent; color: var(--ink-soft); font: 650 13px/1 var(--plain);
        font-variant-numeric: tabular-nums; letter-spacing: .02em; cursor: pointer;
        -webkit-tap-highlight-color: transparent; }
      .valley-speeds button:active { background: rgba(34,29,24,.10); }
      .valley-speeds button[aria-pressed="true"] { background: var(--ink); color: var(--parchment); }
      .valley-speeds button:focus-visible, .valley-panel:focus-visible,
      .valley-panel-close:focus-visible,
      .valley-sound:focus-visible {
        outline: 2px solid var(--gild); outline-offset: 2px; }

      /* U-09 · el botón de sonido: un círculo del mismo tamaño mínimo que un
         botón de velocidad (§11.3), con la misma piel de instrumento que la
         regleta que tiene al lado — tinta sobre pergamino cuando está
         apagado, el dibujo lo dice todo, nada de texto (CLAUDE.md). */
      .valley-sound { width: 44px; height: 44px; padding: 0; display: flex; align-items: center;
        justify-content: center; border: 1px solid var(--edge); border-radius: 50%; background: var(--plate);
        color: var(--ink-soft); cursor: pointer; box-shadow: 0 2px 6px rgba(34,29,24,.20);
        backdrop-filter: blur(2px); -webkit-tap-highlight-color: transparent; }
      .valley-sound:active { background: rgba(34,29,24,.10); }
      .valley-sound[aria-pressed="false"] { color: var(--ink-soft); opacity: .55; }
      .valley-sound[aria-pressed="true"] .valley-sound-off,
      .valley-sound[aria-pressed="false"] .valley-sound-on { display: none; }

      /* U-05 · los tres destinos de abajo. **Reemplazada por UI-R1**: la barra
         que iba aquí (`.valley-tabbar`/`.valley-tab`) es ahora `.ui-shell-nav`/
         `.ui-shell-tab` en `src/ui/redesign/shell.css`, con la misma piel y
         la misma regla de U-14 (por encima de la crónica y de la gente,
         escondida por la encrucijada y el epitafio). Se retira de aquí y no se
         duplica: es justo lo que el plan pide («retirar del HTML sólo los
         estilos ya reemplazados»). */
      /* U-11 · la pista del inicio guiado: latón sobre tinta, la voz del
         juego, y se toca para pasar. **Su posición la fija UI-R1** en
         `.ui-shell-message .valley-hint` (`shell.css`): antes vivía suelta en
         `bottom: 82px` y se pisaba con el aviso de la crónica en cuanto
         crecía a dos líneas (`docs/life-rounds/evidencia-capturas.md` §3).
         Lo que queda aquí es sólo su piel — colores, tipografía, sombra —,
         no su sitio en la pantalla. */
      .valley-hint { padding: 10px 14px 10px 12px; border: 0; border-left: 3px solid var(--gild-lit);
        border-radius: 0 10px 10px 0; background: var(--night); color: var(--parchment); text-align: left;
        font: italic 15px/1.4 var(--voice); text-wrap: pretty; box-shadow: 0 6px 18px rgba(26,21,17,.35); }
      .valley-hint::after { content: ' ›'; color: var(--gild-lit); font-style: normal; }
      html.crossroad-open .valley-hint { visibility: hidden; }

      /* §11.2 · la ficha. Sube del borde de abajo como una hoja, con un filete
         y no con el trazo de dos píxeles que tenía. */
      .valley-panel { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; box-sizing: border-box;
        max-height: 48%; overflow: auto; padding: 16px 20px max(20px, env(safe-area-inset-bottom));
        background: var(--parchment); border-top: 1px solid var(--edge);
        box-shadow: 0 -6px 18px rgba(34,29,24,.22); color: var(--ink); }
      .valley-panel[hidden] { display: none; }
      .valley-panel h2 { margin: 0 0 6px; text-transform: capitalize; color: var(--ink);
        font: 600 21px/1.15 var(--voice); letter-spacing: .01em; text-wrap: balance; }
      .valley-panel p { margin: 3px 0; color: var(--ink-soft); font: 14px/1.5 var(--plain); }
      /* La salida de la ficha, que no tenía ninguna. 44 px de área táctil
         —§11.7— sobre un cuadro de 24, para que se vea ligera y se toque fácil.
         Va arriba a la derecha y en el hueco del título: la ficha es una
         cartela de pergamino, no un cuadro de diálogo, y una barra de título
         con una cruz la convertiría en lo segundo. */
      .valley-panel-close { position: absolute; top: 6px; right: 8px; width: 44px; height: 44px;
        display: grid; place-items: center; padding: 0; border: 0; background: transparent;
        color: var(--ink-soft); font: 400 26px/1 var(--voice); cursor: pointer; }
      .valley-panel-close:hover { color: var(--ink); }
    </style>
  </head>
  <body>
    <!-- UI-V0/UI-V2 · **El sprite de iconos, incrustado en el documento.**
         Copia de los `<symbol>` de `public/ui/icons.svg`, que sigue siendo la
         fuente que la sesión de arte edita (`encargo-arte-piel.md` §4); una
         prueba (`tests/fast/ui-skin.test.ts`) exige que los dos digan lo mismo,
         para que no se separen.

         Va aquí y no se referencia de fuera por un fallo que UI-V2 midió:
         `<use href="./ui/icons.svg#id">` **no carga cuando la página se abre
         con `file://`** —Chromium bloquea la referencia entre documentos— y así
         es justo como `shot.mjs` abre la demo empaquetada para las capturas de
         cada ronda. En producción (https) sí cargaría, pero entonces las
         capturas con las que se juzga la piel saldrían sin iconos.

         Con el sprite dentro, cualquier ronda escribe sólo la almohadilla:
           <svg class="skin-icon" aria-hidden="true"><use href="#people"/></svg>
         y funciona en `file://`, en la raíz de un dominio y en /project/. -->
    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:none">
    <symbol id="people" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="8" r="3"/>
      <circle cx="16.5" cy="9" r="2.3"/>
      <path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/>
      <path d="M15 14.2c2.6.2 4.6 2.2 4.6 4.8"/>
    </symbol>
    <symbol id="wheat" viewBox="0 0 24 24">
      <!-- El grano: la espiga del prototipo 01, **calcada**.

           Cuatro versiones dibujadas a mano no valieron —una pluma, un romero, una
           aguja y un helecho— y la leccion de las cuatro es que aproximar a ojo un
           dibujo que ya existe es el camino largo. Esta no aproxima:
           `tools/ui/trace-glyph.py` lee el pixel del PNG del prototipo y saca su
           silueta. **No se parece al prototipo: es el prototipo.**

           Receta en `tools/ui/icons/regenerar-calcos.py`, que es quien la genera:
           recuadro (283, 136, 337, 186) y umbral de Otsu corrido **-10**. El -10 lo
           eligio el dueno del diseno sobre -20, -30 y -40 vistos juntos: mas abajo
           los granos se separan mas, pero adelgazan, y a -10 quedan gordos, que es
           lo que hace que se lea como trigo en un chip de 21 px.

           `fill-rule="evenodd"` para que los claros encerrados sean agujeros de
           verdad y no parches del color del chip, y `stroke="none"` explicito
           porque `.skin-icon` hereda `stroke: currentColor` de 1,5 y engordaria la
           silueta 0,75 por lado.

           El original dibujado a mano sigue en `tools/ui/icons/variantes.py` como
