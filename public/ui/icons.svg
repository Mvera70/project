    <!-- El grano: la espiga del prototipo 01, **calcada**.

         Cuatro versiones dibujadas a mano no valieron —una pluma, un romero, una
         aguja y un helecho— y la leccion de las cuatro es que aproximar a ojo un
         dibujo que ya existe es el camino largo. Esta no aproxima:
         `tools/ui/trace-glyph.py` lee el pixel del PNG del prototipo y saca su
         silueta. **No se parece al prototipo: es el prototipo.**

         Receta en `tools/ui/icons/regenerar-calcos.py`, que es quien la genera:
         recuadro (283, 136, 337, 186) y umbral de Otsu corrido **-10**. El -10 lo
         eligio el dueno del diseno sobre -20, -30 y -40 vistos juntos: mas abajo
         los granos se separan mas, pero adelgazan, y a -10 quedan gordos, que es
         lo que hace que se lea como trigo en un chip de 21 px.

         `fill-rule="evenodd"` para que los claros encerrados sean agujeros de
         verdad y no parches del color del chip, y `stroke="none"` explicito
         porque `.skin-icon` hereda `stroke: currentColor` de 1,5 y engordaria la
         silueta 0,75 por lado.

         El original dibujado a mano sigue en `tools/ui/icons/variantes.py` como
         variante B, por si algun dia se quiere volver. -->
    <path fill="currentColor" fill-rule="evenodd" stroke="none"
          d="M14.03 1.92L13.26 2.89L12.96 3.44L12.53 4.69L12.40 5.91L12.60 7.04L12.91 7.90L13.44 8.61L13.97 8.87L13.87 9.59L13.34 10.20L12.90 10.49L12.35 10.77L11.94 10.73L11.69 10.39L11.59 9.73L11.63 7.96L11.49 6.83L11.01 6.03L10.57 5.79L10.30 5.91L9.60 6.76L8.87 8.19L8.50 9.43L8.46 10.50L8.66 11.44L8.84 11.85L9.21 12.37L9.40 12.47L9.98 12.30L10.63 11.75L10.79 11.68L11.01 11.78L10.40 12.73L8.73 14.68L7.42 16.03L7.07 16.27L6.93 16.23L6.97 15.79L7.42 14.89L7.73 13.84L7.76 13.30L7.61 12.22L7.23 11.23L6.70 10.43L6.26 10.15L6.08 10.19L5.87 10.40L5.11 11.99L4.70 13.72L4.78 14.71L5.50 16.71L5.54 17.47L5.28 18.25L4.74 19.06L2.70 21.17L2.09 21.94L2.00 22.24L2.05 22.52L3.05 22.88L3.72 22.42L5.57 20.47L6.46 19.66L7.22 19.20L7.85 19.08L8.87 19.49L9.88 19.66L10.95 19.56L11.57 19.35L12.99 18.62L13.95 17.93L14.17 17.66L14.18 17.21L13.87 16.80L13.59 16.62L12.73 16.39L12.14 16.34L10.79 16.43L9.58 16.90L8.30 17.62L8.13 17.61L8.08 17.47L8.30 17.06L9.50 15.81L10.13 14.76L12.63 12.50L13.45 11.55L14.14 10.51L15.16 9.62L16.25 7.69L16.92 7.09L16.81 6.90L16.68 6.91L15.40 8.07L14.76 8.39L14.61 8.31L14.64 8.01L15.47 6.05L15.63 5.35L15.64 4.04L15.41 2.89L14.99 1.92L14.72 1.69L14.40 1.69ZM20.06 1.28L19.37 1.55L18.23 2.21L17.41 3.00L17.30 3.45L17.44 3.94L17.83 4.46L18.47 5.01L19.73 5.18L20.34 4.80L21.40 3.48L21.91 2.38L21.93 1.55L21.68 1.09L21.10 1.00ZM17.90 7.63L17.13 7.84L16.58 8.14L16.23 8.53L15.78 9.29L15.85 9.59L16.12 9.92L17.30 10.63L17.94 10.86L18.54 10.95L19.10 10.91L20.48 10.28L21.45 9.44L21.87 7.98L21.48 7.75L20.82 7.61L19.11 7.55ZM13.82 12.59L12.82 13.20L12.09 13.85L12.20 14.07L12.54 14.33L13.13 14.61L13.96 14.94L14.76 15.06L15.55 14.99L16.31 14.73L17.60 13.87L18.10 12.81L17.87 12.52L16.94 12.28L15.69 12.17L15.03 12.22Z"/>
