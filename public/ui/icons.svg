<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- UI-V0 · Los iconos de la interfaz, de trazo, como los del prototipo.
       24 × 24, `fill="none"`, `stroke="currentColor"` 1.5: el color lo pone
       quien los usa, nunca el icono. Se usan con
       `<svg class="skin-icon"><use href="./ui/icons.svg#people"/></svg>`.
       Son deliberadamente simples: `encargo-arte-piel.md` §4 los sustituye si
       la sesión de arte quiere hacerlos mejor, y entonces basta reemplazar el
       `<symbol>` sin tocar una línea de TypeScript. -->
  <defs>
    <g id="skin-icon-defaults" fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

