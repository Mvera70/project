    <path d="M12 14c-2.6 0-3.8-1.1-3.4-2.4-1.9.2-2.8-1-2.3-2.2C4.5 8.7 4.2 7.3 5.4 6.5 5 5.2 5.9 4 7.4 4.2 8 3 9.6 2.7 10.6 3.6c.5-.6 1.3-.9 1.4-.9s.9.3 1.4.9c1-.9 2.6-.6 3.2.6 1.5-.2 2.4 1 2 2.3 1.2.8.9 2.2-.9 2.9.5 1.2-.4 2.4-2.3 2.2.4 1.3-.8 2.4-3.4 2.4Z"/>
