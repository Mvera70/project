<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- UI-V0 · Los iconos de la interfaz, de trazo, como los del prototipo.
       24 × 24, `fill="none"`, `stroke="currentColor"` 1.5: el color lo pone
       quien los usa, nunca el icono. Se usan con
       `<svg class="skin-icon"><use href="./ui/icons.svg#people"/></svg>`.
       Son deliberadamente simples: `encargo-arte-piel.md` §4 los sustituye si
       la sesión de arte quiere hacerlos mejor, y entonces basta reemplazar el
       `<symbol>` sin tocar una línea de TypeScript. -->
  <defs>
    <g id="skin-icon-defaults" fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <!-- La gente: dos cabezas y dos hombros, como la pestaña del prototipo. -->
  <symbol id="people" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="8" r="3"/>
    <circle cx="16.5" cy="9" r="2.3"/>
    <path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/>
    <path d="M15 14.2c2.6.2 4.6 2.2 4.6 4.8"/>
  </symbol>

  <!-- El grano: una espiga. -->
  <symbol id="wheat" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21V9"/>
    <path d="M12 9c0-2.2 1.3-4 3-4.6C15 6.6 13.7 8.4 12 9Z"/>
    <path d="M12 9c0-2.2-1.3-4-3-4.6C9 6.6 10.3 8.4 12 9Z"/>
    <path d="M12 14c0-2 1.2-3.6 2.7-4.2C14.7 11.6 13.5 13.4 12 14Z"/>
    <path d="M12 14c0-2-1.2-3.6-2.7-4.2C9.3 11.6 10.5 13.4 12 14Z"/>
  </symbol>

  <!-- La madera: tres troncos apilados de canto. -->
  <symbol id="logs" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="15.5" r="3.4"/>
    <circle cx="16" cy="15.5" r="3.4"/>
    <circle cx="12" cy="8.6" r="3.4"/>
    <path d="M8 15.5h.01M16 15.5h.01M12 8.6h.01"/>
  </symbol>

  <!-- El ánimo: una cara. -->
  <symbol id="face" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M9 10.5h.01M15 10.5h.01"/>
    <path d="M8.5 14.5c1 1.4 2.2 2 3.5 2s2.5-.6 3.5-2"/>
  </symbol>

  <!-- El valle: dos montes, como la pestaña del prototipo. -->
  <symbol id="mountains" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 18.5 8.5 7l4.2 7"/>
    <path d="M11 18.5 15.5 10l6.5 8.5z"/>
  </symbol>

  <!-- La crónica: un libro abierto. -->
  <symbol id="book" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 6.5C10.5 5.2 8.4 4.5 5 4.5v13c3.4 0 5.5.7 7 2 1.5-1.3 3.6-2 7-2v-13c-3.4 0-5.5.7-7 2Z"/>
    <path d="M12 6.5v13"/>
  </symbol>

  <!-- Seguir a alguien: dos huellas, como el botón FOLLOW del prototipo. -->
  <symbol id="footprints" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 4.5c1.4 0 2.2 1.2 2.2 2.8 0 1.3-.4 2.4-.4 3.6 0 .9.5 1.3.5 2.2 0 1.2-.9 1.9-2.3 1.9s-2.3-.7-2.3-1.9c0-.9.5-1.3.5-2.2 0-1.2-.4-2.3-.4-3.6C4.8 5.7 5.6 4.5 7 4.5Z"/>
    <path d="M17 8.5c1.4 0 2.2 1.2 2.2 2.8 0 1.3-.4 2.4-.4 3.6 0 .9.5 1.3.5 2.2 0 1.2-.9 1.9-2.3 1.9s-2.3-.7-2.3-1.9c0-.9.5-1.3.5-2.2 0-1.2-.4-2.3-.4-3.6 0-1.6.8-2.8 2.2-2.8Z"/>
  </symbol>

  <!-- El ornamento de la bandeja: una hoja de roble. -->
  <symbol id="oak-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21v-7"/>
    <path d="M12 14c-2.6 0-3.8-1.1-3.4-2.4-1.9.2-2.8-1-2.3-2.2C4.5 8.7 4.2 7.3 5.4 6.5 5 5.2 5.9 4 7.4 4.2 8 3 9.6 2.7 10.6 3.6c.5-.6 1.3-.9 1.4-.9s.9.3 1.4.9c1-.9 2.6-.6 3.2.6 1.5-.2 2.4 1 2 2.3 1.2.8.9 2.2-.9 2.9.5 1.2-.4 2.4-2.3 2.2.4 1.3-.8 2.4-3.4 2.4Z"/>
  </symbol>

  <!-- El sol del arco de la cabecera. -->
  <symbol id="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/>
  </symbol>

  <!-- El árbol del sello de lacre. Éste va relleno: es una silueta, no un trazo. -->
  <symbol id="seal-tree" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <path d="M12 3c-3 0-5.2 2.2-5.2 4.8 0 1 .3 1.9.9 2.6-1 .7-1.6 1.7-1.6 2.9C6.1 15.7 8.7 18 12 18s5.9-2.3 5.9-4.7c0-1.2-.6-2.2-1.6-2.9.6-.7.9-1.6.9-2.6C17.2 5.2 15 3 12 3Z"/>
    <path d="M11.2 17h1.6v4.5h-1.6z"/>
  </symbol>
</svg>
