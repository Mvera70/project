          d="M11.99 4.82L6.26 7.33L5.40 7.78L4.45 8.64L4.31 9.14L4.24 11.12L4.12 11.77L3.87 12.25L3.50 12.55L3.00 12.67L2.14 13.17L1.43 13.99L1.05 15.03L1.04 16.22L1.24 16.82L1.59 17.40L2.09 17.96L4.43 19.30L4.88 19.30L5.82 19.15L6.80 18.79L7.27 18.73L7.70 18.84L8.11 19.10L8.92 19.86L10.03 20.38L10.69 20.54L11.79 20.37L13.34 19.85L15.34 18.99L19.68 16.83L21.93 15.63L22.73 14.85L22.96 14.28L22.96 12.86L22.75 11.63L22.38 10.77L21.80 10.24L21.39 10.06L19.53 9.65L19.32 9.53L19.14 9.16L19.12 8.91L19.22 8.74L20.46 7.53L20.77 6.66L20.66 5.69L20.09 4.80L19.09 4.05L18.45 3.78L16.89 3.46L15.66 3.62L14.02 4.08ZM10.32 14.47L11.12 14.71L11.49 14.93L12.18 15.60L12.62 16.47L12.77 17.51L12.65 18.00L12.36 18.46L11.91 18.87L11.29 19.24L9.86 19.55L9.53 19.38L8.73 18.70L8.37 18.06L8.27 17.17L8.43 16.14L8.87 15.27L9.55 14.64ZM7.11 8.35L7.49 8.44L8.23 8.91L8.97 9.80L9.44 10.76L9.53 11.68L9.32 12.07L8.91 12.40L8.29 12.67L7.47 12.88L6.76 12.95L5.73 12.69L5.40 12.36L4.99 11.61L4.90 10.73L5.00 9.98L5.21 9.43L5.83 8.75L6.43 8.41ZM4.26 13.31L5.12 13.56L5.77 14.14L6.20 15.00L6.33 15.98L6.29 16.51L6.08 16.97L5.71 17.34L5.17 17.63L4.47 17.84L3.31 17.78L2.86 17.53L2.49 17.11L2.02 16.26L1.93 15.36L2.24 14.51L2.96 13.75L3.82 13.34ZM18.37 9.84L18.54 9.92L18.52 10.07L17.92 10.54L15.66 11.72L13.27 12.82L11.42 13.42L10.85 13.44L10.78 12.94L13.06 11.78L16.65 10.36ZM6.93 10.89L6.85 11.02L6.90 11.11L7.12 10.77Z"/>
  </symbol>

