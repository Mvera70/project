<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>V-00 · La vida del valle</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; background: #1B1E1A; }
      body {
        display: grid; grid-template-rows: auto 1fr auto; height: 100dvh;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #E8E7DF; overscroll-behavior: none;
      }
      header { padding: 14px 18px 10px; }
      h1 {
        margin: 0 0 3px; font: 600 16px/1.2 Georgia, serif; letter-spacing: .01em;
      }
      .sub { margin: 0; font-size: 12.5px; color: #9AA093; }
      #hud {
        margin-top: 7px; font: 500 12px/1 ui-monospace, Menlo, monospace;
        color: #9DBE8B; font-variant-numeric: tabular-nums;
      }
      #view { display: block; width: 100%; height: 100%; }
      footer {
        display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
        padding: 10px 18px max(14px, env(safe-area-inset-bottom));
        border-top: 1px solid #2C302A;
      }
      button {
        min-height: 38px; padding: 0 13px; border: 1px solid #3A3F37;
        border-radius: 8px; background: #23271F; color: #D9D8D0;
        font: 500 13px/1 inherit; cursor: pointer;
      }
      button[aria-pressed="true"] { background: #9DBE8B; color: #1B1E1A; border-color: #9DBE8B; }
      .gap { flex: 1; }
      .hint { font-size: 12px; color: #7C8074; }
    </style>
  </head>
  <body>
    <header>
      <h1>V-00 · La vida del valle</h1>
      <p class="sub">Ocho cuerpos con posición y velocidad de verdad. Se cruzan, se apartan al chocar y se paran a hablar cuando les apetece. Nada de esto está escrito de antemano.</p>
      <p id="hud">—</p>
    </header>
    <canvas id="view"></canvas>
    <footer>
      <button id="speed-0">Pausa</button>
      <button id="speed-1" aria-pressed="true">1×</button>
      <button id="speed-2">2×</button>
      <button id="speed-4">4×</button>
      <span class="gap"></span>
      <button id="trails" aria-pressed="false">Rastro</button>
      <button id="again">Otra aldea</button>
    </footer>
    <script type="module">
      import { mount } from '../../src/render3d/life/spike/bench.ts';
      mount(document.getElementById('view'), document.getElementById('hud'));
    </script>
  </body>
</html>
