<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover">
<title>Valley skin lamina</title>
<style>
@font-face { font-family: 'Cinzel'; src: url('@@cinzel@@') format('woff2'); font-weight: 400 700; }
@font-face { font-family: 'EB Garamond'; src: url('@@garamond@@') format('woff2'); }
:root {
  --wood: url('@@wood@@'); --woodband: url('@@woodband@@'); --parch: url('@@parchment@@');
  --brass: #C9A24A; --brass-deep: #8A6A2A; --cream: #F1E6CE; --ink: #2A2118; --ink-mute: #6B5A45;
  --give: #29464E; --give-deep: #16262C; --lacquer: #8C2F22; --lacquer-deep: #5A1D15; --sun: #E8C36A;
  --display: 'Cinzel', serif; --read: 'EB Garamond', Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 390px; height: 844px; overflow: hidden; background: #000; }
.screen { position: relative; width: 390px; height: 844px; overflow: hidden; background: #6f8a3c url('@@base@@') center / cover no-repeat; font-family: var(--read); }
/* ---------- la tabla: una sola pieza de madera con canto de latón ---------- */
.plank { background: var(--wood) center / 390px auto; box-shadow: inset 0 0 0 2px rgba(0,0,0,.35), inset 0 0 0 3px rgba(201,162,74,.55), 0 6px 14px rgba(0,0,0,.45); }
.hud { position: absolute; left: 10px; right: 10px; top: 10px; border-radius: 10px; padding: 8px 10px 9px; display: grid; gap: 7px; }
.hud-row { display: flex; align-items: center; gap: 10px; }
.date { flex: 1; display: flex; align-items: center; justify-content: space-between; height: 34px; padding: 0 12px; border-radius: 6px;
  background: linear-gradient(#F6ECD6, #E9DCC0); box-shadow: inset 0 1px 0 #fff8, inset 0 -2px 3px rgba(0,0,0,.18), 0 1px 0 rgba(0,0,0,.4);
  color: var(--ink); font: 700 13.5px/1 var(--display); letter-spacing: .06em; }
.date svg { width: 90px; height: 29px; }
.arc-track { fill: none; stroke: #8A6A2A; stroke-width: 1; } .arc-bead { fill: #8A6A2A; opacity: .4; } .arc-sun line { stroke: var(--sun); stroke-width: 1.4; stroke-linecap: round; } .arc-disc { fill: var(--sun); }
.vitals { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.vital { height: 34px; border-radius: 7px; display: flex; align-items: center; justify-content: center; gap: 5px;
  background: rgba(30,16,8,.72); box-shadow: inset 0 2px 4px rgba(0,0,0,.65), 0 1px 0 rgba(255,214,160,.22);
  color: var(--cream); font: 700 16px/1 var(--display); font-variant-numeric: tabular-nums; }
.vital svg { width: 17px; height: 17px; color: var(--sun); }
.skin-icon { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
/* ---------- la barra: la misma tabla, abajo ---------- */
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: 66px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px 8px 8px; border-radius: 0; box-shadow: inset 0 3px 0 rgba(201,162,74,.5), inset 0 5px 0 rgba(0,0,0,.35), 0 -6px 14px rgba(0,0,0,.35); }
.tab { display: grid; place-items: center; gap: 2px; border-radius: 7px; color: #E9DCC0; opacity: .8; font: 700 10.5px/1 var(--display); letter-spacing: .12em; }
.tab svg { width: 22px; height: 22px; }
.tab.on { opacity: 1; color: var(--cream); background: linear-gradient(rgba(255,205,120,.28), rgba(120,60,20,.25)); box-shadow: inset 0 0 0 2px var(--brass), inset 0 0 12px rgba(255,190,90,.35), 0 2px 0 rgba(0,0,0,.4); text-shadow: 0 0 6px rgba(255,190,90,.6); }
/* ---------- brújula y mandos ---------- */
.compass { position: absolute; left: 12px; bottom: 82px; width: 76px; height: 76px; background: url('@@compass@@') center / cover; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,.4); }
.ctrls { position: absolute; right: 12px; bottom: 84px; display: flex; gap: 8px; }
.rbtn { width: 46px; height: 46px; border-radius: 50%; background: var(--woodband) center / 120px auto; display: grid; place-items: center; color: var(--cream);
  box-shadow: inset 0 0 0 2px var(--brass), inset 0 0 0 3px rgba(0,0,0,.4), 0 3px 6px rgba(0,0,0,.45); font: 700 14px/1 var(--display); }
.rbtn svg { width: 20px; height: 20px; }
/* ---------- A1: la etiqueta de pergamino, junto a la cosa ---------- */
.tag { position: absolute; left: 22px; top: 330px; width: 300px; padding: 12px 14px 11px; background: #F3EAD6 var(--parch) center / 256px; background-blend-mode: multiply;
  border-radius: 3px; color: var(--ink); box-shadow: 0 8px 18px rgba(0,0,0,.4), inset 0 0 0 1px rgba(107,74,46,.35); }
.tag::after { content: ''; position: absolute; left: 150px; bottom: -8px; width: 16px; height: 16px; background: #EFE4CB; transform: rotate(45deg); box-shadow: 2px 2px 3px rgba(0,0,0,.2); }
.tag h3 { margin: 0 0 4px; font: 700 15px/1.2 var(--display); letter-spacing: .04em; }
.tag p { margin: 0; font-size: 16px; line-height: 1.3; color: var(--ink-mute); }
.tag .kv { margin-top: 8px; display: flex; justify-content: space-between; font-size: 15px; }
.tag .kv b { color: var(--give); font-weight: 600; }
.tag-mark { position: absolute; left: 160px; top: 447px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #F3EAD6; box-shadow: 0 0 0 3px rgba(201,162,74,.7); }
/* ---------- B1: el tablón de madera ---------- */
.veil { position: absolute; inset: 0; background: rgba(20,12,6,.42); }
.board { position: absolute; left: 14px; right: 14px; top: 120px; bottom: 90px; border-radius: 10px; padding: 46px 12px 12px; display: grid; gap: 10px; align-content: start; overflow: hidden; }
.board-title { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); padding: 7px 18px; border-radius: 2px; background: #F3EAD6 var(--parch) center / 256px; background-blend-mode: multiply; color: var(--ink);
  font: 700 13px/1 var(--display); letter-spacing: .2em; box-shadow: 0 2px 0 rgba(0,0,0,.5); }
.board-close { position: absolute; right: 10px; top: 8px; width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #A8402F, var(--lacquer) 55%, var(--lacquer-deep)); border: 2px solid var(--brass); display: grid; place-items: center; color: var(--cream); font: 700 22px/1 var(--read); }
.note { position: relative; padding: 11px 12px 10px; background: #F3EAD6 var(--parch) center / 256px; background-blend-mode: multiply; color: var(--ink); border-radius: 2px; box-shadow: 0 3px 6px rgba(0,0,0,.45); display: grid; gap: 6px; }
.note:nth-child(odd) { transform: rotate(-.8deg); } .note:nth-child(even) { transform: rotate(.6deg); }
.note::before { content: ''; position: absolute; left: 50%; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #2B1A0E; box-shadow: 0 1px 0 rgba(255,255,255,.3); }
.note h4 { margin: 0; font: 700 13.5px/1.2 var(--display); letter-spacing: .04em; }
.note p { margin: 0; font-size: 15px; line-height: 1.3; color: var(--ink-mute); font-style: italic; }
.note .facts { font-size: 14px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.note .risk { color: var(--lacquer); }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.step { display: flex; align-items: center; gap: 5px; }
.step i { width: 32px; height: 32px; border-radius: 5px; background: var(--woodband) center / 100px auto; box-shadow: inset 0 0 0 1px rgba(0,0,0,.5), 0 2px 0 rgba(0,0,0,.35); color: var(--cream); font: 700 18px/32px var(--read); text-align: center; font-style: normal; }
.step em { min-width: 16px; text-align: center; font: 700 16px/1 var(--display); font-style: normal; }
.send { padding: 9px 16px; border-radius: 6px; background: linear-gradient(#33565F, var(--give) 55%, var(--give-deep)); color: var(--cream); box-shadow: inset 0 0 0 2px var(--brass), 0 3px 0 var(--give-deep); font: 700 12px/1 var(--display); letter-spacing: .14em; }
.away { color: var(--cream); text-align: center; font-size: 14.5px; font-style: italic; text-shadow: 0 1px 0 rgba(0,0,0,.6); }
.why { font-size: 14px; color: var(--ink-mute); }
</style></head><body>
<div class="screen" id="screen">
  @@SPRITE@@
  <header class="hud plank">
    <div class="hud-row">
      <div class="date"><span>YEAR 50 · SPRING, DAY 1</span>
        <svg viewBox="0 0 90 29" aria-hidden="true">
          <polyline class="arc-track" points="@@ARC@@"/>
          @@BEADS@@
          <g class="arc-sun" transform="translate(45 9)">@@RAYS@@<circle class="arc-disc" r="5"/></g>
        </svg></div>
    </div>
    <div class="vitals">
      <div class="vital"><svg class="skin-icon" viewBox="0 0 24 24"><use href="#face"/></svg>35</div>
      <div class="vital"><svg class="skin-icon" viewBox="0 0 24 24"><use href="#wheat"/></svg>76</div>
      <div class="vital"><svg class="skin-icon" viewBox="0 0 24 24"><use href="#logs"/></svg>326</div>
      <div class="vital"><svg class="skin-icon" viewBox="0 0 24 24"><use href="#stone"/></svg>33</div>
      <div class="vital"><svg class="skin-icon" viewBox="0 0 24 24"><use href="#silver"/></svg>36</div>
    </div>
  </header>
  @@BODY@@
  <div class="compass"></div>
  <div class="ctrls">
    <div class="rbtn"><svg class="skin-icon" viewBox="0 0 24 24"><use href="#mountains"/></svg></div>
    <div class="rbtn">❚❚</div>
    <div class="rbtn">1×</div>
  </div>
  <nav class="nav plank">
    <div class="tab on"><svg class="skin-icon" viewBox="0 0 24 24"><use href="#mountains"/></svg>VALLEY</div>
    <div class="tab"><svg class="skin-icon" viewBox="0 0 24 24"><use href="#book"/></svg>CHRONICLE</div>
    <div class="tab"><svg class="skin-icon" viewBox="0 0 24 24"><use href="#people"/></svg>PEOPLE</div>
  </nav>
</div>
</body></html>
